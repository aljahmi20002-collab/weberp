version: "3.8"

services:
  # =============================================
  #  MySQL Database
  # =============================================
  db:
    image: mysql:8.0
    container_name: weberp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: weberp
      MYSQL_USER: weberp
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/dummydata:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      retries: 10
      interval: 5s
      timeout: 5s
    networks:
      - weberp-net

  # =============================================
  #  PHP + Laravel Application
  # =============================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: weberp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: weberp
      DB_USERNAME: weberp
      DB_PASSWORD: secret
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    networks:
      - weberp-net
    # Entrypoint: runs composer + npm + migrations once, then starts the server
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["serve"]

  # =============================================
  #  Nginx Web Server
  # =============================================
  web:
    image: nginx:alpine
    container_name: weberp-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - weberp-net

  # =============================================
  #  phpMyAdmin (optional, remove if not needed)
  # =============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: weberp-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db
    networks:
      - weberp-net

volumes:
  dbdata:
  vendor_data:
  node_modules_data:

networks:
  weberp-net:
    driver: bridge
