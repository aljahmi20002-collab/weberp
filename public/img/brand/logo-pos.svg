<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 56" role="img" aria-label="WebPOS">
  <defs>
    <linearGradient id="webposG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Icon: POS terminal -->
  <g transform="translate(4,4)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="url(#webposG)"/>
    <!-- screen -->
    <rect x="10" y="10" width="28" height="18" rx="2.5" fill="#fff"/>
    <rect x="13" y="13" width="9" height="2.5" rx="1" fill="#4F46E5" opacity="0.85"/>
    <rect x="25" y="13" width="10" height="2.5" rx="1" fill="#7C3AED" opacity="0.7"/>
    <rect x="13" y="18" width="22" height="2.5" rx="1" fill="#C7D2FE"/>
    <rect x="13" y="22.5" width="15" height="2.5" rx="1" fill="#C7D2FE"/>
    <!-- receipt -->
    <path d="M27 26 L38 26 L38 40 Q36.5 38 35 40 Q33.5 42 32 40 Q30.5 38 29 40 L27 40 Z" fill="#fff"/>
    <line x1="29.5" y1="30" x2="35.5" y2="30" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
    <line x1="29.5" y1="33" x2="35.5" y2="33" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
    <line x1="29.5" y1="36" x2="33.5" y2="36" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-0.5">
    <text x="66" y="38" font-size="26" fill="#1E293B">Web</text>
    <text x="118" y="38" font-size="26" fill="#4F46E5">POS</text>
  </g>
</svg>
