<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-label="WebERP">
  <defs>
    <linearGradient id="weberpG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with grid + POS hint -->
  <g transform="translate(4,4)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="url(#weberpG)"/>
    <!-- grid dots -->
    <g fill="#fff" opacity="0.92">
      <circle cx="14" cy="14" r="2.6"/>
      <circle cx="24" cy="14" r="2.6"/>
      <circle cx="34" cy="14" r="2.6"/>
      <circle cx="14" cy="24" r="2.6"/>
      <circle cx="34" cy="24" r="2.6"/>
      <circle cx="14" cy="34" r="2.6"/>
      <circle cx="24" cy="34" r="2.6"/>
      <circle cx="34" cy="34" r="2.6"/>
    </g>
    <!-- center tile (active) -->
    <rect x="21" y="21" width="6" height="6" rx="1.2" fill="#fff"/>
    <!-- POS receipt hint -->
    <rect x="32.5" y="20" width="7" height="12" rx="1.5" fill="#fff" opacity="0.9"/>
    <line x1="34" y1="24" x2="38" y2="24" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
    <line x1="34" y1="27" x2="38" y2="27" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="37" y2="30" stroke="#4F46E5" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-0.5">
    <text x="66" y="38" font-size="26" fill="#1E293B">Web</text>
    <text x="118" y="38" font-size="26" fill="#4F46E5">ERP</text>
  </g>
</svg>
